<!DOCTYPE html>
<html>
<head>
    <title>Test Parser</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 20px auto;
            padding: 20px;
        }
        pre {
            background: #f5f5f5;
            padding: 15px;
            border: 1px solid #ccc;
            overflow-x: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <h2>Transcript Parser Test</h2>
    <input type="file" id="pdfInput" accept=".pdf">
    <button onclick="test()">Test Parse</button>
    
    <h3>Results:</h3>
    <pre id="output">No results yet...</pre>
    
    <h3>All Matches (before filtering):</h3>
    <pre id="debug">No debug info yet...</pre>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <script src="transcript-parser.js"></script>
    <script>
        async function test() {
            const file = document.getElementById('pdfInput').files[0];
            if (!file) return alert('Select a PDF');
            
            try {
                // Get full text
                const pdfUrl = URL.createObjectURL(file);
                const pdf = await pdfjsLib.getDocument(pdfUrl).promise;
                
                let textPages = [];
                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    const content = await page.getTextContent();
                    textPages.push(content.items.map(item => item.str).join(' '));
                }
                
                const fullText = textPages.join(' ');
                
                // Debug: show all matches
                const pattern = /([A-Z]+)\s+(\d{3,4}[A-Z]?)\s+([\p{L}\s\.&\-']+?)\s+(UG|GR|FDY)\s+(A\+|A-|A|B\+|B-|B|C\+|C-|C|D\+|D-|D|F|S|U|W|I)\s+\d+\.\d+/gu;                let match;
                let allMatches = [];
                
                while ((match = pattern.exec(fullText)) !== null) {
                    const code = match[1] + match[2];
                    const grade = match[5];
                    const afterMatch = fullText.substring(match.index + match[0].length, match.index + match[0].length + 50);
                    const isExcluded = afterMatch.includes('Excluded') || afterMatch.includes('Registered');
                    
                    allMatches.push({
                        code: code,
                        grade: grade,
                        excluded: isExcluded,
                        reason: isExcluded ? (afterMatch.includes('Excluded') ? 'Excluded' : 'Registered') : 'OK'
                    });
                }
                
                document.getElementById('debug').textContent = 
                    'Total matches: ' + allMatches.length + '\n\n' +
                    JSON.stringify(allMatches, null, 2);
                
                // Parse normally
                const json = await parseTranscript(file);
                const parsed = JSON.parse(json);
                
                document.getElementById('output').textContent = 
                    'Final course count: ' + Object.keys(parsed).length + '\n\n' + json;
                
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('output').textContent = 'Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
